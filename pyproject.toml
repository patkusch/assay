[project]
name = "assay"
version = "0.1.0"
description = "Fast, local, typed decisions with calibrated confidence. An open take on the System One idea."
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"
keywords = ["llm", "classification", "calibration", "routing", "guardrails", "decision-model"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
assay = "assay.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/patkusch/assay"
Issues = "https://github.com/patkusch/assay/issues"
