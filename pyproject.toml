[project]
name = "assay"
version = "0.1.0"
description = "Fast, local, typed decisions with calibrated confidence. An open take on the System One idea."
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
assay = "assay.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
